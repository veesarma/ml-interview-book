[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbook"
version = "0.1.0"
description = "From-scratch, interview-grade implementations accompanying the ML Interview Book"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
docs = ["mkdocs-material>=9.5", "pymdown-extensions>=10"]
viz = ["manim>=0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
