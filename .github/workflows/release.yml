name: Build the offline book

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pandoc and the PDF engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libcairo2 libpango-1.0-0 libpangoft2-1.0-0
          pip install -r requirements.txt weasyprint
      - name: Build EPUB, PDF and single-file HTML
        run: python scripts/build_book.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: ml-interview-book
          path: |
            build/ML-Interview-Book.epub
            build/ML-Interview-Book.pdf
            build/ML-Interview-Book.html
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ML-Interview-Book.epub
            build/ML-Interview-Book.pdf
            build/ML-Interview-Book.html
